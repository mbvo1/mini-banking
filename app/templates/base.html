<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mini Banking{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <span class="brand">Mini Banking</span>
    {% if sess %}
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ sess.csrf }}">
      <span class="who">{{ sess.full_name }}</span>
      <button type="submit" class="link">Sair</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Projeto acadêmico de demonstração. Não use dados reais.</footer>
</body>
</html>
