{% extends "base.html" %}
{% block title %}Entrar · Mini Banking{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Entrar</h1>
  {% if error %}<p class="alert error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" autocomplete="off">
    <label for="username">Usuário</label>
    <input id="username" name="username" type="text" autocomplete="username" maxlength="64" required>

    <label for="password">Senha</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>

    <label for="code">Código do autenticador (6 dígitos)</label>
    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9]{6}" maxlength="6" required>

    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
